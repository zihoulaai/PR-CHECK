[project]
name = "pr-check"
version = "1.0.0"
description = "PR 提交前置自检 Agent MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlmodel>=0.0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pr-check = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# app 包整体入 wheel（含 app/hooks/pre-push 等包内资源），CLI 走 app.cli:main。
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# ===== lint（ruff）=====
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "UP"]
ignore = [
    # UP042：把 `(str, Enum)` 换成 `StrEnum` 会改变 str() 的结果
    # （`"RuleVerdict.OK"` → `"ok"`）。全库输出路径已统一走 `.value`，风险很低，
    # 但这属于语义变更而非风格变更，收益不足以承担「报告文案静默改变」的风险。
    # 等真的出现依赖 str(枚举成员) 的代码再评估。
    "UP042",
]
# I（isort）暂不启用：tests/eval_harness.py 与 tests/mutation_check.py 必须在
# 调整 sys.path 之后再 import app.*（否则 app 不在 path 上），靠 `# noqa: E402`
# 容忍 import 不在顶部。开启 isort 会与这一约定冲突并产生大面积无意义重排。
# 待这些文件改用包安装方式运行后再评估启用。

[tool.ruff.lint.per-file-ignores]
# 测试里大量使用 assert 与直接构造领域对象，不受 lint 约束
"tests/*" = ["B011"]
# prompt.py 的主体是嵌入的提示词文本（SYSTEM_PROMPT 三引号字符串），行宽按「模型
# 实际读到的排版」而非代码风格约束；折行会插入换行并改变发给模型的文本。
# 而三引号字符串**内部无法写 # noqa**（注释进不了字符串），故只能整文件豁免。
# 该文件里 prompt.py 的代码行仍由 E501 之外的其他规则覆盖。
"app/agent/prompt.py" = ["E501"]
# fakes.py 的主体是内嵌的 diff 样本字符串（DEFAULT_SAMPLE_DIFF 等三引号常量）。
# 字符串内部无法写 # noqa，而手工折行会改动样本内容（diff 换行会被解析成新文件块），
# 风险大于收益，故整文件豁免 E501；该文件的其余规则照常生效。
"app/adapters/fakes.py" = ["E501"]

# ===== 类型检查（mypy）=====
# 卡门范围：整个 app/，实测 0 error（mypy 2.4.0，45 个源文件）。
#
# 曾分档接入（domain/report/parser/cli 先进门、agent/adapters/storage 挂账），
# 现已全部清零并把卡门扩到全 app。清零过程中修掉的都是真实问题，不是类型洁癖：
#   - registry 用实例协议标注「适配器类」→ 一堆与真实错误无关的
#     Unexpected keyword argument（拆出 Factory 协议解决）；
#   - gate.py / evidence.py 四段循环复用同一个 `it` / `verdict`，mypy 按首段
#     钉死类型；具名化后顺带让「这一段处理哪类条目」变得可读；
#   - json_body 标注 object 导致下游任何遍历都报错 → 改 Any 并加 json_items()
#     形状校验（原先 `data or []` 遇对象会静默当成「没数据」）；
#   - SQLModel 字段静态类型就是普通 str/int，`KbDoc.id.in_(x)` 认不出 →
#     统一走 col()（SQLModel 的类型化列入口），而不是逐处加 type: ignore；
#   - maas_kb 同一符号在模块级被定义两次（别名 + 兼容函数）。
#
# 不启用 --disallow-untyped-defs：tests 94% 未标注，逐个补是纯体力活且几乎
# 不产生缺陷发现（见 README「开发门禁」一节）。
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ['^tests/']
warn_redundant_casts = true
warn_unused_ignores = true
