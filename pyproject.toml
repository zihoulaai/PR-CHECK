[project]
name = "pr-check"
version = "1.0.0"
description = "PR 提交前置自检 Agent MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlmodel>=0.0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pr-check = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# app 包整体入 wheel（含 app/hooks/pre-push 等包内资源），CLI 走 app.cli:main。
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
